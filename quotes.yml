# - "_id": "6aad421d60ac3bd3a3f2f41b"
#   "text": "Пририсовать змее ноги. 画蛇添足. huà shé tiān zú. Переусердствовать, испортить дело лишним."
# - "_id": "6aad421d60ac3bd3a3f2f41c"
#   "text": "Играть на лютне перед буйволом. 对牛弹琴. duì niú tán qín. Метать бисер перед свиньями; напрасно тратить слова."
# - "_id": "6aad421d60ac3bd3a3f2f41d"
#   "text": "Нарисовать дракону зрачки. 画龙点睛. huà lóng diǎn jīng. Добавить последний решающий штрих, который оживляет всё дело."
# - "_id": "6aad421d60ac3bd3a3f2f41e"
#   "text": "Смотреть на небо со дна колодца. 坐井观天. zuò jǐng guān tiān. Иметь крайне ограниченный кругозор."
# - "_id": "6aad421d60ac3bd3a3f2f41f"
#   "text": "Ждать зайца у дерева. 守株待兔. shǒu zhū dài tù. Рассчитывать на случайную удачу, ничего не делая."
# - "_id": "6aad421d60ac3bd3a3f2f420"
#   "text": "Лягушка на дне колодца. 井底之蛙. jǐng dǐ zhī wā. О человеке с узким кругозором."
# - "_id": "6aad421d60ac3bd3a3f2f421"
#   "text": "Старик на границе потерял лошадь. 塞翁失马. sài wēng shī mǎ. Нет худа без добра; неудача может обернуться удачей."
# - "_id": "6aad421d60ac3bd3a3f2f422"
#   "text": "Затыкать уши при краже колокольчика. 掩耳盗铃. yǎn ěr dào líng. Самообман; прятать голову в песок."
# - "_id": "6aad421d60ac3bd3a3f2f423"
#   "text": "Разбить котлы и затопить лодки. 破釜沉舟. pò fǔ chén zhōu. Сжечь мосты; решиться на всё."
# - "_id": "6aad421d60ac3bd3a3f2f424"
#   "text": "Иметь в груди готовый бамбук. 胸有成竹. xiōng yǒu chéng zhú. Иметь продуманный план действий."
# - "_id": "6aad421d60ac3bd3a3f2f425"
#   "text": "Чинить загон после пропажи овец. 亡羊补牢. wáng yáng bǔ láo. Лучше поздно, чем никогда."
# - "_id": "6aad421d60ac3bd3a3f2f426"
#   "text": "Называть оленя лошадью. 指鹿为马. zhǐ lù wéi mǎ. Выдавать чёрное за белое; намеренно искажать истину."
# - "_id": "6aad421d60ac3bd3a3f2f427"
#   "text": "Любишь дом — люби и ворону на нём. 爱屋及乌. ài wū jí wū. Любишь человека — принимай и всё, что с ним связано."
# - "_id": "6aad421d60ac3bd3a3f2f428"
#   "text": "Пол-цзиня и восемь лянов. 半斤八两. bàn jīn bā liǎng. Одно и то же; два сапога пара."
# - "_id": "6aad421d60ac3bd3a3f2f429"
#   "text": "Журавль среди кур. 鹤立鸡群. hè lì jī qún. Белая ворона; человек, резко выделяющийся среди окружающих."
# - "_id": "6aad421d60ac3bd3a3f2f42a"
#   "text": "Голова тигра, хвост змеи. 虎头蛇尾. hǔ tóu shé wěi. Начать за здравие, а кончить за упокой."
# - "_id": "6aad421d60ac3bd3a3f2f42b"
#   "text": "Капля воды камень точит. 水滴石穿. shuǐ dī shí chuān. Терпение и труд всё перетрут."
# - "_id": "6aad421e60ac3bd3a3f2f42c"
#   "text": "Тушить горящий воз хвороста чашкой воды. 杯水车薪. bēi shuǐ chē xīn. Капля в море; тщетная попытка."
# - "_id": "6aad421e60ac3bd3a3f2f42d"
#   "text": "Не слышно ни ворон, ни воробьёв. 鸦雀无声. yā què wú shēng. Полная тишина; слышно, как муха пролетит."
# - "_id": "6aad421e60ac3bd3a3f2f42e"
#   "text": "Впустить волка в дом. 引狼入室. yǐn láng rù shì. Пригреть змею на груди."
# - "_id": "6aad421e60ac3bd3a3f2f42f"
#   "text": "Вечны как небо и земля. 天长地久. tiān cháng dì jiǔ. На веки вечные."
# - "_id": "6aad421e60ac3bd3a3f2f430"
#   "text": "Ломать сухое и гнилое. 摧枯拉朽. cuī kū lā xiǔ. Проще простого; плёвое дело."
# - "_id": "6aad421e60ac3bd3a3f2f431"
#   "text": "Душа покинула тело. 魂不附体. hún bù fù tǐ. Быть в смятении; места себе не находить."
# - "_id": "6aad421e60ac3bd3a3f2f432"
#   "text": "Большая рыба и жирное мясо. 大鱼大肉. dà yú dà ròu. Богатое угощение; обильная пища."
# - "_id": "6aad421e60ac3bd3a3f2f433"
#   "text": "Тянуть ростки, чтобы они быстрее выросли. 拔苗助长. bá miáo zhù zhǎng. Оказывать медвежью услугу."
# - "_id": "6aad421e60ac3bd3a3f2f434"
#   "text": "Лечить яд ядом. 以毒攻毒. yǐ dú gōng dú. Клин клином вышибать."
# - "_id": "6aad421e60ac3bd3a3f2f435"
#   "text": "Масляные уста, скользкий язык. 油嘴滑舌. yóu zuǐ huá shé. Болтать без умолку; язык без костей."
# - "_id": "6aad421e60ac3bd3a3f2f436"
#   "text": "Солнце садится, дорога кончается. 日暮途穷. rì mù tú qióng. Оказаться в безвыходном положении."
# - "_id": "6aad421e60ac3bd3a3f2f437"
#   "text": "Проникнуть в дерево на три фэня. 入木三分. rù mù sān fēn. О глубоком анализе или мощном воздействии."
# - "_id": "6aad421e60ac3bd3a3f2f438"
#   "text": "Трижды посетить соломенную хижину. 三顾茅庐. sān gù máo lú. Настойчиво приглашать талантливого человека."
# - "_id": "6aad421e60ac3bd3a3f2f439"
#   "text": "Трое человек создают тигра. 三人成虎. sān rén chéng hǔ. Ложь, повторённая многократно, начинает казаться правдой."
# - "_id": "6aad421e60ac3bd3a3f2f43a"
#   "text": "Зарезать петуха, чтобы напугать обезьян. 杀鸡儆猴. shā jī jǐng hóu. Наказать одного в назидание другим."
# - "_id": "6aad421e60ac3bd3a3f2f43b"
#   "text": "Ситуация подобна раскалыванию бамбука. 势如破竹. shì rú pò zhú. О стремительном, неудержимом продвижении."
# - "_id": "6aad421e60ac3bd3a3f2f43c"
#   "text": "Персиковый источник вне мира. 世外桃源. shì wài táo yuán. Райский уголок; идиллическое место."
# - "_id": "6aad421e60ac3bd3a3f2f43e"
#   "text": "Сычуаньская собака лает на солнце. 蜀犬吠日. shǔ quǎn fèi rì. Удивляться самым обычным вещам из-за своей невежественности."
# - "_id": "6aad421e60ac3bd3a3f2f43f"
#   "text": "Связать и положить на высокую полку. 束之高阁. shù zhī gāo gé. Положить под сукно; отложить в долгий ящик."
# - "_id": "6aad421e60ac3bd3a3f2f440"
#   "text": "Вода спадёт — камни обнажатся. 水落石出. shuǐ luò shí chū. Тайное становится явным."
# - "_id": "6aad421e60ac3bd3a3f2f441"
#   "text": "Со всех сторон слышны чуские песни. 四面楚歌. sì miàn chǔ gē. Оказаться в полной изоляции; быть окружённым врагами."
# - "_id": "6aad421e60ac3bd3a3f2f442"
#   "text": "Меняться в лице при упоминании тигра. 谈虎色变. tán hǔ sè biàn. Дрожать от одного упоминания о чём-то страшном."
# - "_id": "6aad421e60ac3bd3a3f2f443"
#   "text": "Цветок, распустившийся на миг. 昙花一现. tán huā yī xiàn. О чём-то быстротечном, эфемерном."
# - "_id": "6aad421e60ac3bd3a3f2f444"
#   "text": "Богомол пытается задержать колесницу. 螳臂当车. táng bì dāng chē. Переоценивать свои силы; пытаться сделать невозможное."
# - "_id": "6aad421e60ac3bd3a3f2f445"
#   "text": "Небесные цветы сыплются дождём. 天花乱坠. tiān huā luàn zhuì. Говорить очень красноречиво, но часто пусто и бессодержательно."
# - "_id": "6aad421f60ac3bd3a3f2f446"
#   "text": "Край неба и угол моря. 天涯海角. tiān yá hǎi jiǎo. На краю света; очень далёкое место."
# - "_id": "6aad421f60ac3bd3a3f2f447"
#   "text": "Божественные одежды не имеют швов. 天衣无缝. tiān yī wú fèng. Безупречный, идеальный; без сучка и задоринки."
# - "_id": "6aad421f60ac3bd3a3f2f448"
#   "text": "Переправляться через реку в одной лодке. 同舟共济. tóng zhōu gòng jì. Делить трудности и помогать друг другу."
# - "_id": "6aad421f60ac3bd3a3f2f449"
#   "text": "Украсть небо и подменить солнце. 偷天换日. tōu tiān huàn rì. Совершить грандиозный обман."
# - "_id": "6aad421f60ac3bd3a3f2f44a"
#   "text": "Когда карта развернулась, показался кинжал. 图穷匕见. tú qióng bǐ xiàn. Истинные намерения раскрываются в последний момент."
# - "_id": "6aad421f60ac3bd3a3f2f44b"
#   "text": "Вернуть нефритовый диск в целости в Чжао. 完璧归赵. wán bì guī zhào. Вернуть вещь владельцу в полной сохранности."
# - "_id": "6aad421f60ac3bd3a3f2f44c"
#   "text": "Утолять жажду, глядя на сливы. 望梅止渴. wàng méi zhǐ kě. Утешать себя иллюзиями."
# - "_id": "6aad421f60ac3bd3a3f2f44d"
#   "text": "Помогать тигру нападать на жертву. 为虎作伥. wèi hǔ zuò chāng. Быть пособником в злых делах."
- "_id": "6aad421f60ac3bd3a3f2f44e"
  "text": "Спать на хворосте и лизать желчь. 卧薪尝胆. wò xīn cháng dǎn. Терпеть лишения ради будущей победы или мести."
- "_id": "6aad421f60ac3bd3a3f2f44f"
  "text": "Прятать нож в улыбке. 笑里藏刀. xiào lǐ cáng dāo. Быть лицемерным и коварным."
- "_id": "6aad421f60ac3bd3a3f2f450"
  "text": "Обрезать ноги, чтобы подошли туфли. 削足适履. xuē zú shì lǚ. Подгонять реальность под жёсткие рамки; действовать неразумно."
- "_id": "6aad421f60ac3bd3a3f2f451"
  "text": "Опустить флаги и перестать бить в барабаны. 偃旗息鼓. yǎn qí xī gǔ. Прекратить борьбу; свернуть деятельность."
- "_id": "6aad421f60ac3bd3a3f2f452"
  "text": "Князь Е любил драконов. 叶公好龙. yè gōng hào lóng. Любить что-то лишь на словах, а на деле бояться."
- "_id": "6aad421f60ac3bd3a3f2f453"
  "text": "Зазнавшийся князь из Елана. 夜郎自大. yè láng zì dà. Кичиться своим мнимым превосходством из-за невежества."
- "_id": "6aad421f60ac3bd3a3f2f454"
  "text": "Поднять боевой дух первым ударом барабана. 一鼓作气. yī gǔ zuò qì. Сделать рывок на подъёме энтузиазма."
- "_id": "6aad421f60ac3bd3a3f2f455"
  "text": "Одной стрелой убить двух беркутов. 一箭双雕. yī jiàn shuāng diāo. Убить двух зайцев одним выстрелом."
- "_id": "6aad421f60ac3bd3a3f2f456"
  "text": "Поразить всех одним криком. 一鸣惊人. yī míng jīng rén. Внезапно прославиться; стать знаменитым после долгого молчания."
- "_id": "6aad421f60ac3bd3a3f2f457"
  "text": "Енотовидные собаки с одного холма. 一丘之貉. yī qiū zhī hé. Одного поля ягоды; два сапога пара (в негативном смысле)."
- "_id": "6aad421f60ac3bd3a3f2f458"
  "text": "Старик Юй Гун передвигает горы. 愚公移山. yú gōng yí shān. Упорство и решимость способны преодолеть любые преграды."
- "_id": "6aad421f60ac3bd3a3f2f459"
  "text": "Выдавать рыбий глаз за жемчужину. 鱼目混珠. yú mù hùn zhū. Выдавать подделку за настоящее."
- "_id": "6aad421f60ac3bd3a3f2f45a"
  "text": "Звуки мелодии ещё витают вокруг балок. 余音绕梁. yú yīn rào liáng. О прекрасной, долго не забывающейся музыке или речи."
- "_id": "6aad421f60ac3bd3a3f2f45b"
  "text": "Просить у тигра его шкуру. 与虎谋皮. yǔ hǔ móu pí. Заниматься заведомо безнадёжным и опасным делом."
- "_id": "6aad421f60ac3bd3a3f2f45c"
  "text": "Кулик и беззубка сражаются. 鹬蚌相争. yù bàng xiāng zhēng. Борьба двух сторон, которой пользуется третья."
- "_id": "6aad421f60ac3bd3a3f2f45d"
  "text": "Утром три, вечером четыре. 朝三暮四. zhāo sān mù sì. Семь пятниц на неделе; быть непостоянным."
- "_id": "6aad421f60ac3bd3a3f2f45e"
  "text": "Обсуждать стратегию на бумаге. 纸上谈兵. zhǐ shàng tán bīng. Заниматься пустыми, оторванными от жизни рассуждениями."
- "_id": "6aad421f60ac3bd3a3f2f45f"
  "text": "Искать коня по рисунку. 按图索骥. àn tú suǒ jì. Действовать шаблонно, без учёта реальности."
- "_id": "6aad421f60ac3bd3a3f2f460"
  "text": "Сто выстрелов — сто попаданий. 百发百中. bǎi fā bǎi zhòng. Действовать наверняка; быть абсолютно точным."
- "_id": "6aad422060ac3bd3a3f2f461"
  "text": "Размахивать топором перед воротами Лу Баня. 班门弄斧. bān mén nòng fǔ. Хвастаться мастерством перед настоящим мастером."
- "_id": "6aad422060ac3bd3a3f2f462"
  "text": "Принимать отражение лука в чаше за змею. 杯弓蛇影. bēi gōng shé yǐng. Страдать от пустых страхов и подозрений."
- "_id": "6aad422060ac3bd3a3f2f463"
  "text": "Строить карету за закрытыми воротами. 闭门造车. bì mén zào chē. Действовать в отрыве от реальности."
- "_id": "6aad422060ac3bd3a3f2f464"
  "text": "Раздувать мех в поисках изъяна. 吹毛求疵. chuī máo qiú cī. Придираться к мелочам."
- "_id": "6aad422060ac3bd3a3f2f465"
  "text": "Бить по траве, чтобы вспугнуть змею. 打草惊蛇. dǎ cǎo jīng shé. Спровоцировать противника неосторожными действиями."
- "_id": "6aad422060ac3bd3a3f2f466"
  "text": "Выманить тигра с гор. 调虎离山. diào hǔ lí shān. Заставить противника покинуть выгодную позицию."
- "_id": "6aad422060ac3bd3a3f2f467"
  "text": "Дун Ши, подражая красавице, хмурит брови. 东施效颦. dōng shī xiào pín. Неумелое подражание, вызывающее лишь смех."
- "_id": "6aad422060ac3bd3a3f2f468"
  "text": "Принести хворост и просить о наказании. 负荆请罪. fù jīng qǐng zuì. Искренне извиняться за свою вину."
- "_id": "6aad422060ac3bd3a3f2f469"
  "text": "Погубить успех дела из-за пустяка. 功亏一篑. gōng kuī yī kuì. Испортить всё в последний момент из-за мелочи."
- "_id": "6aad422060ac3bd3a3f2f46a"
  "text": "Удовлетворяться стоянием на месте. 故步自封. gù bù zì fēng. Коснеть; отказываться от развития."
- "_id": "6aad422060ac3bd3a3f2f46b"
  "text": "Выплёвывать песок, стреляя в тень. 含沙射影. hán shā shè yǐng. Тайно вредить; делать намёки, завуалированные выпады."
- "_id": "6aad422060ac3bd3a3f2f46c"
  "text": "Обмануть небо, чтобы переплыть море. 瞞天過海. mán tiān guò hǎi. Скрывать истинные намерения под привычным покровом; совершать тайное под видом обычного."
- "_id": "6aad422060ac3bd3a3f2f46d"
  "text": "Осадить Вэй, чтобы спасти Чжао. 圍魏救趙. wéi wèi jiù zhào. Вместо прямого удара помочь союзнику, напав на базу врага, вынуждая его отступить."
- "_id": "6aad422060ac3bd3a3f2f46e"
  "text": "Убить чужим ножом. 借刀殺人. jiè dāo shā rén. Уничтожить противника руками третьей стороны, сохранив свои силы."
- "_id": "6aad422060ac3bd3a3f2f46f"
  "text": "В покое ожидать утомлённого врага. 以逸待勞. yǐ yì dài láo. Сохранять силы и выжидать, пока противник истощится."
- "_id": "6aad422060ac3bd3a3f2f470"
  "text": "Грабить во время пожара. 趁火打劫. chèn huǒ dǎ jié. Воспользоваться бедственным положением другого для своей выгоды."
- "_id": "6aad422060ac3bd3a3f2f471"
  "text": "Поднять шум на востоке — напасть на западе. 聲東擊西. shēng dōng jī xī. Отвлечь противника ложным манёвром и ударить в незащищённое место."
- "_id": "6aad422060ac3bd3a3f2f472"
  "text": "Извлечь нечто из ничего. 無中生有. wú zhōng shēng yǒu. Создать ложную угрозу или слух, чтобы добиться реального результата."
- "_id": "6aad422060ac3bd3a3f2f473"
  "text": "Для вида чинить деревянные мостки, втайне выступить в Чэньцан. 明修棧道, 暗渡陳倉. míng xiū zhàn dào, àn dù Chéncāng. Демонстрировать один план, чтобы скрыть истинное направление удара."
- "_id": "6aad422060ac3bd3a3f2f474"
  "text": "Наблюдать за огнём с противоположного берега. 隔岸觀火. gé àn guān huǒ. Выжидать, не вмешиваясь, пока противники ослабляют друг друга."
- "_id": "6aad422060ac3bd3a3f2f475"
  "text": "Скрывать за улыбкой кинжал. 笑裡藏刀. xiào lǐ cáng dāo. Внешне дружелюбно, но втайне готовить злой умысел."
- "_id": "6aad422060ac3bd3a3f2f476"
  "text": "Пожертвовать сливой чтобы спасти персик. 李代桃僵. lǐ dài táo jiāng. Пожертвовать меньшим ради спасения большего; подменить одну часть, чтобы сохранить целое."
- "_id": "6aad422060ac3bd3a3f2f477"
  "text": "Увести овцу лёгкой рукой. 順手牽羊. shùn shǒu qiān yáng. Воспользоваться удобным случаем, чтобы получить небольшую выгоду без затрат."
- "_id": "6aad422060ac3bd3a3f2f478"
  "text": "Бить по траве, чтобы вспугнуть змею. 打草驚蛇. dǎ cǎo jīng shé. Неосторожными действиями предупредить противника и сорвать замысел."
- "_id": "6aad422060ac3bd3a3f2f479"
  "text": "Позаимствовать труп, чтобы вернуть душу. 借屍還魂. jiè shī huán hún. Использовать старую форму или отживший авторитет для оживления нового дела."
- "_id": "6aad422060ac3bd3a3f2f47a"
  "text": "Сманить тигра с горы на равнину. 調虎離山. diào hǔ lí shān. Выманить противника из выгодной позиции, чтобы лишить его преимущества."
- "_id": "6aad422060ac3bd3a3f2f47b"
  "text": "Если хочешь что-нибудь поймать, сначала отпусти. 欲擒故縱. yù qín gù zòng. Намеренно ослабить давление, чтобы противник расслабился и попал в ловушку."
- "_id": "6aad422160ac3bd3a3f2f47c"
  "text": "Бросить кирпич, чтобы получить нефрит. 拋磚引玉. pāo zhuān yǐn yù. Высказать скромную мысль или сделать простой ход, чтобы вызвать лучший ответ."
- "_id": "6aad422160ac3bd3a3f2f47d"
  "text": "Чтобы поймать разбойников, надо прежде поймать главаря. 擒賊擒王. qín zéi qín wáng. Сначала обезвредить главного врага, тогда остальные сдадутся."
- "_id": "6aad422160ac3bd3a3f2f47e"
  "text": "Тайно вытаскивать хворост из-под котла другого. 釜底抽薪. fǔ dǐ chōu xīn. Устранить коренную причину проблемы, а не бороться с последствиями."
- "_id": "6aad422160ac3bd3a3f2f47f"
  "text": "Ловить рыбу в мутной воде. 混水摸魚. hún shuǐ mō yú. Воспользоваться неразберихой для получения выгоды."
- "_id": "6aad422160ac3bd3a3f2f480"
  "text": "Цикада сбрасывает свою золотую кожицу. 金蟬脫殼. jīn chán tuō qiào. Ловко скрыться, оставив ложный след или пустую оболочку."
- "_id": "6aad422160ac3bd3a3f2f481"
  "text": "Закрыть дверь, чтобы поймать вора. 關門捉賊. guān mén zhuō zéi. Отрезать противнику пути к отступлению и захватить его."
- "_id": "6aad422160ac3bd3a3f2f482"
  "text": "Объединиться с дальним врагом, чтобы побить ближнего. 遠交近攻. yuǎn jiāo jìn gōng. Дружить с дальними государствами и нападать на ближних, чтобы расширяться постепенно."
- "_id": "6aad422160ac3bd3a3f2f483"
  "text": "Объявить, что только собираешься пройти сквозь государство Го, и захватить его. 假道伐虢. jiǎ dào fá Guó. Воспользоваться просьбой о проходе как предлогом для захвата слабого соседа."
- "_id": "6aad422160ac3bd3a3f2f484"
  "text": "Украсть балки и заменить их гнилыми подпорками. 偷梁換柱. tōu liáng huàn zhù. Тайно подменить ключевые элементы, чтобы подорвать конструкцию изнутри."
- "_id": "6aad422160ac3bd3a3f2f485"
  "text": "Указывая на тутовое дерево, ругать акацию. 指桑罵槐. zhǐ sāng mà huái. Ругать одного, чтобы пристыдить или предупредить другого."
- "_id": "6aad422160ac3bd3a3f2f486"
  "text": "Прикидываться безумным, сохраняя рассудок. 假癡不癲. jiǎ chī bù diān. Притворяться неспособным или безумным, чтобы усыпить бдительность и выжидать."
- "_id": "6aad422160ac3bd3a3f2f487"
  "text": "Заманить на крышу и убрать лестницу. 上屋抽梯. shàng wū chōu tī. Заманить противника в ловушку и отрезать путь к отступлению."
- "_id": "6aad422160ac3bd3a3f2f488"
  "text": "Украсить сухие деревья искусственными цветами. 樹上開花. shù shàng kāi huā. Придать делу видимость процветания или силы, чтобы обмануть противника."
