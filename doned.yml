- "_id": "6aad421d60ac3bd3a3f2f41b"
  "text": "Пририсовать змее ноги. 画蛇添足. huà shé tiān zú. Переусердствовать, испортить дело лишним."
- "_id": "6aad421d60ac3bd3a3f2f41c"
  "text": "Играть на лютне перед буйволом. 对牛弹琴. duì niú tán qín. Метать бисер перед свиньями; напрасно тратить слова."
- "_id": "6aad421d60ac3bd3a3f2f41d"
  "text": "Нарисовать дракону зрачки. 画龙点睛. huà lóng diǎn jīng. Добавить последний решающий штрих, который оживляет всё дело."
- "_id": "6aad421d60ac3bd3a3f2f41e"
  "text": "Смотреть на небо со дна колодца. 坐井观天. zuò jǐng guān tiān. Иметь крайне ограниченный кругозор."
- "_id": "6aad421d60ac3bd3a3f2f41f"
  "text": "Ждать зайца у дерева. 守株待兔. shǒu zhū dài tù. Рассчитывать на случайную удачу, ничего не делая."
- "_id": "6aad421d60ac3bd3a3f2f420"
  "text": "Лягушка на дне колодца. 井底之蛙. jǐng dǐ zhī wā. О человеке с узким кругозором."
- "_id": "6aad421d60ac3bd3a3f2f421"
  "text": "Старик на границе потерял лошадь. 塞翁失马. sài wēng shī mǎ. Нет худа без добра; неудача может обернуться удачей."
- "_id": "6aad421d60ac3bd3a3f2f422"
  "text": "Затыкать уши при краже колокольчика. 掩耳盗铃. yǎn ěr dào líng. Самообман; прятать голову в песок."
- "_id": "6aad421d60ac3bd3a3f2f423"
  "text": "Разбить котлы и затопить лодки. 破釜沉舟. pò fǔ chén zhōu. Сжечь мосты; решиться на всё."
- "_id": "6aad421d60ac3bd3a3f2f424"
  "text": "Иметь в груди готовый бамбук. 胸有成竹. xiōng yǒu chéng zhú. Иметь продуманный план действий."
- "_id": "6aad421d60ac3bd3a3f2f425"
  "text": "Чинить загон после пропажи овец. 亡羊补牢. wáng yáng bǔ láo. Лучше поздно, чем никогда."
- "_id": "6aad421d60ac3bd3a3f2f426"
  "text": "Называть оленя лошадью. 指鹿为马. zhǐ lù wéi mǎ. Выдавать чёрное за белое; намеренно искажать истину."
- "_id": "6aad421d60ac3bd3a3f2f427"
  "text": "Любишь дом — люби и ворону на нём. 爱屋及乌. ài wū jí wū. Любишь человека — принимай и всё, что с ним связано."
- "_id": "6aad421d60ac3bd3a3f2f428"
  "text": "Пол-цзиня и восемь лянов. 半斤八两. bàn jīn bā liǎng. Одно и то же; два сапога пара."
- "_id": "6aad421d60ac3bd3a3f2f429"
  "text": "Журавль среди кур. 鹤立鸡群. hè lì jī qún. Белая ворона; человек, резко выделяющийся среди окружающих."
- "_id": "6aad421d60ac3bd3a3f2f42a"
  "text": "Голова тигра, хвост змеи. 虎头蛇尾. hǔ tóu shé wěi. Начать за здравие, а кончить за упокой."
- "_id": "6aad421d60ac3bd3a3f2f42b"
  "text": "Капля воды камень точит. 水滴石穿. shuǐ dī shí chuān. Терпение и труд всё перетрут."
- "_id": "6aad421e60ac3bd3a3f2f42c"
  "text": "Тушить горящий воз хвороста чашкой воды. 杯水车薪. bēi shuǐ chē xīn. Капля в море; тщетная попытка."
- "_id": "6aad421e60ac3bd3a3f2f42d"
  "text": "Не слышно ни ворон, ни воробьёв. 鸦雀无声. yā què wú shēng. Полная тишина; слышно, как муха пролетит."
- "_id": "6aad421e60ac3bd3a3f2f42e"
  "text": "Впустить волка в дом. 引狼入室. yǐn láng rù shì. Пригреть змею на груди."
- "_id": "6aad421e60ac3bd3a3f2f42f"
  "text": "Вечны как небо и земля. 天长地久. tiān cháng dì jiǔ. На веки вечные."
- "_id": "6aad421e60ac3bd3a3f2f430"
  "text": "Ломать сухое и гнилое. 摧枯拉朽. cuī kū lā xiǔ. Проще простого; плёвое дело."
- "_id": "6aad421e60ac3bd3a3f2f431"
  "text": "Душа покинула тело. 魂不附体. hún bù fù tǐ. Быть в смятении; места себе не находить."
- "_id": "6aad421e60ac3bd3a3f2f432"
  "text": "Большая рыба и жирное мясо. 大鱼大肉. dà yú dà ròu. Богатое угощение; обильная пища."
- "_id": "6aad421e60ac3bd3a3f2f433"
  "text": "Тянуть ростки, чтобы они быстрее выросли. 拔苗助长. bá miáo zhù zhǎng. Оказывать медвежью услугу."